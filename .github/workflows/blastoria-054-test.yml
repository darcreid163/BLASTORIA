name: BLASTORIA 0.5.4 / Godot isolated QA (10 authored levels)

on:
  push:
    branches:
      - codex/classic-100-rulebook-0.5.4
    paths:
      - '.github/workflows/blastoria-054-test.yml'
      - 'scripts/**'
      - 'resources/**'
      - 'scenes/**'
      - 'project.godot'
      - 'localization/**'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-qa:
    name: Godot 4.5.1 / parse, regression, UI smoke, package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Download official Godot 4.5.1 binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-download
          find /tmp/godot-download -maxdepth 1 -type f -print
          sudo install -m 755 /tmp/godot-download/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version

      - name: Clean Godot project import
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import 2>&1 | tee godot-import.log

      - name: All regression tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee godot-tests.log

      - name: Menu navigation smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tools/menu_smoke.gd 2>&1 | tee godot-menu-smoke.log

      - name: Create portable Godot source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r BLASTORIA_0_5_4_Godot_Source.zip . \
            -x '.git/*' '.godot/*' 'builds/*' 'godot-*.log' 'BLASTORIA_0_5_4_Godot_Source.zip'
          unzip -t BLASTORIA_0_5_4_Godot_Source.zip | tail -2
          sha256sum BLASTORIA_0_5_4_Godot_Source.zip > SOURCE_SHA256.txt

      - name: Upload Godot project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLASTORIA-0.5.4-Godot-Source
          path: |
            BLASTORIA_0_5_4_Godot_Source.zip
            SOURCE_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation logs on failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BLASTORIA-0.5.4-QA-Logs
          path: |
            godot-import.log
            godot-tests.log
            godot-menu-smoke.log
          if-no-files-found: ignore
          retention-days: 14
